        // --- 輔助函數：智慧標籤亮顯 ---
        const SmartText = ({ text }) => {
            if (!text) return null;
            const processedHtml = text
                .replace(/(預約代號|重要預約|預約)/g, '<span class="inline-block bg-stone-100 text-stone-700 px-2.5 py-0.5 rounded-lg font-bold text-xs mx-1 shadow-sm border border-stone-300">📌 $1</span>')
                .replace(/\*\*(.*?)\*\*/g, '<strong class="text-stone-900 font-black">$1</strong>');
            return <div dangerouslySetInnerHTML={{ __html: processedHtml }} className="leading-relaxed text-stone-600 text-[15px]" />;
        };

                : null;

                                <span className="text-[9px] font-bold tracking-wide">路線</span>
                            </a>
                        )}

                        </div>
                    )}
                    <div className="mt-1 mb-4 pl-1">
                        <SmartText text={event.desc} />
                    </div>
                    {event.tips && (
                        <div className="mt-2">
                            {showTips ? (
                                <div className="bg-stone-50 p-4 rounded-2xl border border-stone-200 animate-fade-in relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>

                                    </div>

            const [activeTab, setActiveTab] = useState('itinerary');
            const [selectedDay, setSelectedDay] = useState(1);
            const currentDayData = tripData.itinerary.find(d => d.day === selectedDay);

            return (
                <div className="min-h-screen max-w-md mx-auto bg-[#f4f4f6] text-gray-800 font-sans relative pb-24 shadow-2xl overflow-hidden sm:rounded-3xl sm:border-8 sm:border-gray-900 sm:my-8">
                    <header className="bg-white px-6 pt-12 pb-4 shadow-sm sticky top-0 z-40">
                        <h1 className="text-2xl font-black text-gray-900 tracking-tight">{tripData.general.title}</h1>
                        <p className="text-sm text-stone-500 font-medium mt-1">{tripData.general.date} · 大眾運輸版</p>
                    </header>

                    <main className="p-4 h-[calc(100vh-160px)] overflow-y-auto no-scrollbar">
                        {activeTab === 'itinerary' && (
                            <div className="animate-fade-in pb-8">
                                <div className="pt-2 pb-4">
                                    <h2 className="text-2xl font-black text-stone-800 tracking-wide">行程導航</h2>
                                    <p className="text-stone-500 text-sm mt-1">精準掌握乘車與步行路線</p>
                                </div>
                                <div className="flex overflow-x-auto no-scrollbar gap-3 mb-6 pb-2 -mx-4 px-4">
                                    {tripData.itinerary.map(d => (
                                        <button 
                                            key={d.day} onClick={() => setSelectedDay(d.day)}
                                            className={`flex-shrink-0 flex flex-col items-center justify-center w-16 h-[5.5rem] rounded-[1.25rem] transition-all duration-300 ${selectedDay === d.day ? 'bg-stone-800 text-stone-50 shadow-md scale-105' : 'bg-white text-stone-400 border border-stone-200 hover:bg-stone-50'}`}
                                        >
                                            <span className="text-[10px] font-bold tracking-widest opacity-80 mb-1">DAY {d.day}</span>
                                            <span className="text-xl font-black">{d.date.split(' ')[0]}</span>
                                        </button>
                                    ))}
                                </div>
                                <div className="bg-white rounded-[1.5rem] mb-8 shadow-sm border border-stone-200 overflow-hidden relative">
                                    {currentDayData.heroImage && (
                                        <div className="w-full h-44 relative bg-stone-200">
                                            <img src={currentDayData.heroImage} alt={currentDayData.location} className="w-full h-full object-cover animate-fade-in" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-stone-900/30 to-transparent"></div>
                                        </div>
                                    )}
                                    <div className="px-5 pb-5 pt-2 flex items-center justify-between bg-white relative">
                                        <div className="flex items-center gap-4">
                                            <div className="bg-stone-100 p-3 rounded-[1rem] text-stone-800 shadow-sm z-10 -mt-10 border-4 border-white relative flex-shrink-0"><Map size={22} /></div>
                                            <div className="z-10 mt-1">
                                                <p className="text-[10px] text-stone-400 font-bold tracking-widest mb-0.5">今日區域</p>
                                                <h2 className="text-lg font-black text-stone-800 tracking-wide leading-tight">{currentDayData.location}</h2>
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-end pl-3 border-l border-stone-100 z-10 mt-1">
                                            <span className="text-[10px] text-stone-400 font-bold tracking-widest mb-1">氣溫</span>
                                            <div className="flex items-center gap-1.5 text-stone-800 font-black">
                                                {currentDayData.weather.icon}
                                                <span className="text-xl">{currentDayData.weather.temp}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="relative border-l-2 border-dashed border-stone-200 ml-4 py-2 space-y-6">
                                    {currentDayData.events.map((evt, idx) => (
                                        <div key={idx} className="relative pl-6 pr-1">
                                            <div className="absolute top-[1.25rem] -left-[7px] w-3 h-3 bg-white border-4 border-stone-800 rounded-full shadow-sm z-10"></div>
                                            <EventCard event={evt} />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {activeTab === 'tools' && (
                            <div className="animate-fade-in space-y-8 pb-8">
                                <div className="pt-2 pb-2">
                                    <h2 className="text-2xl font-black text-stone-800 tracking-wide">實用工具</h2>
                                    <p className="text-stone-500 text-sm mt-1">航班、住宿與緊急聯絡資訊</p>
                                </div>
                                <section className="space-y-4">
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="bg-stone-800 p-1.5 rounded-lg text-stone-50"><Plane size={18}/></div>
                                        <h3 className="text-lg font-bold text-stone-800">航班資訊</h3>
                                    </div>
                                    {tripData.tools.flights.map((flight, idx) => (
                                        <div key={idx} className="bg-white rounded-[1.5rem] p-5 border border-stone-200 shadow-sm relative overflow-hidden">
                                            <div className="absolute top-0 right-0 bg-stone-100 text-stone-600 text-[10px] font-bold px-3 py-1.5 rounded-bl-[1rem] tracking-widest">{flight.bound}</div>
                                            <div className="text-xs font-bold text-stone-400 mb-5 tracking-wide">{flight.airline} · {flight.flightNo} · {flight.date}</div>
                                            <div className="flex justify-between items-center relative px-2">
                                                <div className="absolute left-[3.5rem] right-[3.5rem] top-1/2 -translate-y-1/2 border-t-2 border-dashed border-stone-200 z-0"></div>
                                                <div className="text-center bg-white z-10 pr-3"><div className="text-3xl font-black text-stone-800">{flight.dep}</div><div className="text-[10px] font-bold text-stone-400 mt-1">{flight.depTerm}</div></div>
                                                <div className="bg-white z-10 px-2 flex flex-col items-center mt-[-10px]"><Plane size={18} className="text-stone-300 transform rotate-45 mb-1" /><div className="text-[10px] font-bold text-stone-400 bg-stone-50 px-2 py-0.5 rounded-full">{flight.duration}</div></div>
                                                <div className="text-center bg-white z-10 pl-3"><div className="text-3xl font-black text-stone-800">{flight.arr}</div><div className="text-[10px] font-bold text-stone-400 mt-1">{flight.arrTerm}</div></div>
                                            </div>
                                        </div>
                                    ))}
                                </section>
                                <section className="space-y-4">
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="bg-stone-800 p-1.5 rounded-lg text-stone-50"><Bed size={18}/></div>
                                        <h3 className="text-lg font-bold text-stone-800">住宿資訊</h3>
                                    </div>
                                    {tripData.tools.hotels.map((hotel, idx) => (
                                        <div key={idx} className="bg-white rounded-[1.5rem] p-5 border border-stone-200 shadow-sm relative">
                                            <div className="flex justify-between items-start mb-3">
                                                <div><span className="inline-block px-2.5 py-1 bg-stone-100 text-stone-600 text-[10px] font-bold rounded-lg mb-2">{hotel.city} · {hotel.dates}</span><h4 className="text-[17px] font-bold text-stone-800 leading-tight pr-4">{hotel.name}</h4></div>
                                            </div>
                                            <p className="text-xs text-stone-500 mb-5 leading-relaxed flex items-start"><MapPin size={14} className="mr-1 mt-0.5 flex-shrink-0 opacity-70"/> {hotel.address}</p>
                                            <div className="flex gap-3">
                                                {hotel.phone && (<a href={`tel:${hotel.phone}`} className="flex-1 flex items-center justify-center bg-stone-50 hover:bg-stone-100 text-stone-700 py-3 rounded-xl text-xs font-bold transition-colors border border-stone-200"><Phone size={14} className="mr-2"/> 聯絡飯店</a>)}
                                                <a href={hotel.map} target="_blank" rel="noreferrer" className="flex-1 flex items-center justify-center bg-stone-800 hover:bg-stone-900 text-stone-50 py-3 rounded-xl text-xs font-bold transition-colors shadow-md"><Navigation size={14} className="mr-2"/> 開啟導航</a>
                                            </div>
                                        </div>
                                    ))}
                                </section>
                                <section className="space-y-4">
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="bg-red-50 p-1.5 rounded-lg text-red-500"><AlertCircle size={18}/></div>
                                        <h3 className="text-lg font-bold text-stone-800">緊急聯絡</h3>
                                    </div>
                                    <div className="bg-white rounded-[1.5rem] p-2 border border-stone-200 shadow-sm">
                                        {tripData.tools.emergency.map((em, idx) => (
                                            <a key={idx} href={`tel:${em.number}`} className="flex items-center justify-between p-4 hover:bg-stone-50 rounded-xl transition-colors group">
                                                <div className="flex flex-col"><span className="text-sm font-bold text-stone-800">{em.name}</span><span className="text-lg font-black text-red-500 font-mono mt-0.5">{em.number}</span></div>
                                                <div className="bg-stone-100 p-2 rounded-full text-stone-400 group-hover:bg-red-50 group-hover:text-red-500 transition-colors"><Phone size={16} /></div>
                                            </a>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        )}
                    </main>

                    <nav className="absolute bottom-0 w-full bg-white/80 backdrop-blur-lg border-t border-gray-200 pb-[env(safe-area-inset-bottom,20px)] pt-3 px-6 flex justify-around items-center z-50">
                        <button onClick={() => setActiveTab('itinerary')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'itinerary' ? 'text-gray-900' : 'text-gray-400'}`}>
                            <Calendar size={24} className={activeTab === 'itinerary' ? 'fill-gray-100' : ''}/><span className="text-[10px] font-bold">行程導航</span>
                        </button>
                        <div className="relative -top-6">
                            <div className="bg-stone-800 text-stone-50 p-4 rounded-full shadow-lg shadow-stone-300 flex items-center justify-center"><Train size={28} /></div>
                        </div>
                        <button onClick={() => setActiveTab('tools')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'tools' ? 'text-gray-900' : 'text-gray-400'}`}>
                            <Info size={24} className={activeTab === 'tools' ? 'fill-gray-100' : ''}/><span className="text-[10px] font-bold">實用工具</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<KansaiDriveApp />);
    </script>
</body>
</html>
